name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-test:
    name: Build, test, and audit NuGet packages
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore and audit NuGet packages
        run: >-
          dotnet restore PCL.Aurora.slnx
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Report vulnerable packages
        run: >-
          dotnet list PCL.Aurora.slnx package
          --vulnerable
          --include-transitive
          --no-restore

      - name: Build
        run: dotnet build PCL.Aurora.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PCL.Aurora.slnx --configuration Release --no-build --no-restore
