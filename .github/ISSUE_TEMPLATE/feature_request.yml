# Form structure adapted from PCL-CE's improvement suggestion form (Apache-2.0).
# Rewritten for PCL Aurora by Micro-ATP.
name: "功能建议 / Feature Request"
description: "建议新增功能或改进现有体验 / Suggest a new feature or an improvement"
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请描述要解决的问题，而不只是给出一个按钮或页面名称。尚不成熟的想法可以先在 Discussions 的“想法”分类讨论。

        Describe the problem to solve, not only a button or page name. Early-stage ideas can be discussed in the Ideas category under Discussions first.

  - type: checkboxes
    id: checklist
    attributes:
      label: "提交前检查 / Checklist"
      options:
        - label: "我已搜索[现有 Issues](https://github.com/Micro-ATP/PCL-Aurora/issues) 和 [Discussions](https://github.com/Micro-ATP/PCL-Aurora/discussions)，没有发现相同建议。 / I searched the [existing issues](https://github.com/Micro-ATP/PCL-Aurora/issues) and [Discussions](https://github.com/Micro-ATP/PCL-Aurora/discussions) and found no duplicate."
          required: true
        - label: "我确认这项建议与 PCL Aurora 的跨平台 Minecraft 启动器定位有关。 / I confirmed this request fits PCL Aurora's scope as a cross-platform Minecraft launcher."
          required: true
        - label: "我理解维护者不会保证实现时间，并愿意参与后续需求澄清。 / I understand there is no guaranteed implementation timeline and I am willing to clarify the request."
          required: true

  - type: textarea
    id: problem
    attributes:
      label: "要解决的问题 / Problem"
      description: "说明当前流程中的具体困难、影响对象和发生频率。 / Explain the concrete difficulty, affected users, and how often it occurs."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "期望方案 / Proposed Solution"
      description: "说明期望的交互、结果和必要边界；可附草图或同类实现。 / Describe the expected interaction, result, and constraints. Mockups or comparable implementations are welcome."
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: "涉及平台 / Affected Platforms"
      description: "选择最主要的平台；若涉及多个平台，请在补充信息中列出。 / Choose the primary platform and list additional platforms below."
      options:
        - "全部平台 / All platforms"
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "现有替代方案 / Current Workarounds"
      description: "说明现在如何绕过问题，以及替代方案为什么不足。 / Explain current workarounds and why they are insufficient."
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: "补充信息 / Additional Context"
      description: "可附截图、流程图、相关文档或上游实现链接。 / Add screenshots, flow diagrams, documentation, or relevant upstream implementation links."
    validations:
      required: false
